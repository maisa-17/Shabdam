<svg xmlns="http://www.w3.org/2000/svg" viewBox="114 58 284 408">
  <defs>
    <path id="pin" d="M146 240A118 118 0 1 1 366 240L291 405Q256 465 221 405Z"/>
    <clipPath id="pin-clip"><use href="#pin"/></clipPath>
    <!-- Cuts the centre hole out so the background shows through -->
    <mask id="pin-hole">
      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <circle cx="256" cy="195" r="52" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#pin-hole)">
    <!-- Body: white pin with a soft grey shade along the right edge -->
    <g clip-path="url(#pin-clip)">
      <use href="#pin" fill="#e6e6e6"/>
      <use href="#pin" fill="#ffffff" transform="translate(-16 -6)"/>
    </g>

    <!-- Outline -->
    <use href="#pin" fill="none" stroke="#1a1a1a" stroke-width="22" stroke-linejoin="round"/>
  </g>
</svg>
